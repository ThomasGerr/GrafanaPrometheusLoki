# GENERATED by scripts/generate.py from clients.yml — do not edit by hand.
# One prom-label-proxy per client — the server-side boundary that makes
# a client's Grafana Org unable to see another client's metrics.

services:
  prom-label-proxy-self:
    image: quay.io/prometheuscommunity/prom-label-proxy:v0.13.0
    container_name: em-plp-self
    restart: unless-stopped
    command:
    - --label=client
    - --label-value=self
    - --upstream=http://prometheus:9090
    - --insecure-listen-address=0.0.0.0:8080
    - --enable-label-apis
    - --error-on-replace
    networks:
    - monitor
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      prometheus:
        condition: service_healthy
