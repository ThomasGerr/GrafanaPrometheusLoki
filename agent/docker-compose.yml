# ─────────────────────────────────────────────────────────────────────────────
# grafana-prometheus-loki agent — runs on each monitored host.
#
# Installed to /opt/grafana-prometheus-loki-agent by install.sh. One container; it
# opens no inbound ports and only ever connects outbound to the ingest URL.
#
# Optional: CrowdSec, which detects attacks in the same logs and blocks the
# attackers in the host's firewall. Its two services are in the `crowdsec`
# profile, so they exist only when install.sh --crowdsec has put
# COMPOSE_PROFILES=crowdsec in .env. See docs/crowdsec.md.
# ─────────────────────────────────────────────────────────────────────────────

services:
  alloy:
    image: grafana/alloy:v1.19.0
    container_name: grafana-prometheus-loki-agent
    restart: unless-stopped

    # Needed to read the host's cgroups, processes and block devices.
    # This is the same access cAdvisor and node_exporter normally require.
    privileged: true
    pid: host

    command:
      - run
      # Bound to loopback: the agent's own UI is for local debugging only.
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      # Otherwise Alloy reports which components it runs to Grafana Labs.
      - --disable-reporting
      # A directory: Alloy loads every .alloy file in it as one config.
      - /etc/alloy

    environment:
      CLIENT_ID: ${CLIENT_ID:?CLIENT_ID is required}
      HOST_NAME: ${HOST_NAME:?HOST_NAME is required}
      INGEST_URL: ${INGEST_URL:?INGEST_URL is required}
      INGEST_PASSWORD: ${INGEST_PASSWORD:?INGEST_PASSWORD is required}

    # Databases on this host that listen on its own loopback are reached
    # through the Docker gateway. Harmless when there are none.
    extra_hosts:
      - host.docker.internal:host-gateway

    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      # Database monitoring: the per-engine components, the connections
      # install.sh wrote for this host, and their credentials (root-only).
      # Databases running in other containers are reached by joining their
      # networks, which install.sh adds in docker-compose.override.yml.
      - ./databases.alloy:/etc/alloy/databases.alloy:ro
      - ./connections.alloy:/etc/alloy/connections.alloy:ro
      # Collects CrowdSec's metrics when it is enabled (connections.alloy
      # then instantiates it); inert otherwise.
      - ./crowdsec.alloy:/etc/alloy/crowdsec.alloy:ro
      - ./db-secrets:/etc/alloy-secrets:ro
      # Write-ahead log. Metrics survive a central outage and replay on
      # reconnect, so a maintenance window leaves no gap in the graphs.
      - alloy-data:/var/lib/alloy/data
      # Host filesystem, read-only — node metrics.
      - /:/rootfs:ro,rslave
      - /sys:/sys:ro
      # Container metrics and logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      # System logs. install.sh sets JOURNAL_DIR to wherever this host keeps
      # its journal; the default covers installs from before it did.
      - ${JOURNAL_DIR:-/var/log/journal}:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── CrowdSec (optional, `crowdsec` profile) ──────────────────────────────
  # The detection engine. Reads the host's journal (sshd) and container logs
  # (Traefik, nginx), and decides whom to ban. The Debian image because the
  # journal source runs journalctl, which the Alpine images do not have.
  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1-debian
    container_name: grafana-prometheus-loki-crowdsec
    profiles: [crowdsec]
    restart: unless-stopped
    environment:
      COLLECTIONS: >-
        crowdsecurity/linux crowdsecurity/sshd crowdsecurity/traefik
        crowdsecurity/nginx crowdsecurity/whitelist-good-actors
      # Registers the firewall bouncer below under this key.
      BOUNCER_KEY_firewall: ${CROWDSEC_BOUNCER_KEY:-}
      # No ENROLL_KEY here on purpose: the image enrolls at every start and
      # exits if that fails, so one mistyped key would crash-loop CrowdSec
      # and leave the host unprotected. install.sh enrolls once instead,
      # after CrowdSec is up, and only warns when it fails.
    volumes:
      # Written by install.sh: which logs to read. Whom never to ban is an
      # allowlist in its database, which install.sh keeps in sync.
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      # Its database of decisions, and the hub items and credentials it
      # downloads on first start.
      - crowdsec-data:/var/lib/crowdsec/data
      - crowdsec-config:/etc/crowdsec
      - ${JOURNAL_DIR:-/var/log/journal}:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Dokploy's Traefik writes its access log to a file, not stdout.
      # install.sh points this at it, or at an empty directory.
      - ${CROWDSEC_TRAEFIK_DIR:-./crowdsec/no-traefik}:/var/log/traefik:ro
    ports:
      # The local API, for the bouncer, which runs in the host's network.
      # Loopback only.
      - "127.0.0.1:${CROWDSEC_LAPI_PORT:-8089}:8080"
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The part that blocks. Pulls decisions from the engine every 10 seconds
  # and drops banned addresses in nftables, for the host and for Docker's
  # published ports alike. Needs the host's network and NET_ADMIN for that,
  # and nothing else. Built here from CrowdSec's package: crowdsec/Dockerfile.
  crowdsec-firewall-bouncer:
    build: ./crowdsec
    image: grafana-prometheus-loki/crowdsec-firewall-bouncer
    container_name: grafana-prometheus-loki-crowdsec-bouncer
    profiles: [crowdsec]
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      CROWDSEC_BOUNCER_KEY: ${CROWDSEC_BOUNCER_KEY:-}
      CROWDSEC_LAPI_PORT: ${CROWDSEC_LAPI_PORT:-8089}
    depends_on:
      crowdsec:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  alloy-data:
  crowdsec-data:
  crowdsec-config:
