# ─────────────────────────────────────────────────────────────────────────────
# grafana-prometheus-loki agent — runs on each monitored host.
#
# Installed to /opt/grafana-prometheus-loki-agent by install.sh. One container; it
# opens no inbound ports and only ever connects outbound to the ingest URL.
# ─────────────────────────────────────────────────────────────────────────────

services:
  alloy:
    image: grafana/alloy:v1.19.0
    container_name: grafana-prometheus-loki-agent
    restart: unless-stopped

    # Needed to read the host's cgroups, processes and block devices.
    # This is the same access cAdvisor and node_exporter normally require.
    privileged: true
    pid: host

    command:
      - run
      # Bound to loopback: the agent's own UI is for local debugging only.
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      # Otherwise Alloy reports which components it runs to Grafana Labs.
      - --disable-reporting
      # A directory: Alloy loads every .alloy file in it as one config.
      - /etc/alloy

    environment:
      CLIENT_ID: ${CLIENT_ID:?CLIENT_ID is required}
      HOST_NAME: ${HOST_NAME:?HOST_NAME is required}
      INGEST_URL: ${INGEST_URL:?INGEST_URL is required}
      INGEST_PASSWORD: ${INGEST_PASSWORD:?INGEST_PASSWORD is required}

    # Databases on this host that listen on its own loopback are reached
    # through the Docker gateway. Harmless when there are none.
    extra_hosts:
      - host.docker.internal:host-gateway

    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      # Database monitoring: the per-engine components, the connections
      # install.sh wrote for this host, and their credentials (root-only).
      # Databases running in other containers are reached by joining their
      # networks, which install.sh adds in docker-compose.override.yml.
      - ./databases.alloy:/etc/alloy/databases.alloy:ro
      - ./connections.alloy:/etc/alloy/connections.alloy:ro
      - ./db-secrets:/etc/alloy-secrets:ro
      # Write-ahead log. Metrics survive a central outage and replay on
      # reconnect, so a maintenance window leaves no gap in the graphs.
      - alloy-data:/var/lib/alloy/data
      # Host filesystem, read-only — node metrics.
      - /:/rootfs:ro,rslave
      - /sys:/sys:ro
      # Container metrics and logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      # System logs. install.sh sets JOURNAL_DIR to wherever this host keeps
      # its journal; the default covers installs from before it did.
      - ${JOURNAL_DIR:-/var/log/journal}:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  alloy-data:
