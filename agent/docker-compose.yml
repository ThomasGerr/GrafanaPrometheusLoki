# ─────────────────────────────────────────────────────────────────────────────
# grafana-prometheus-loki agent — runs on each monitored host.
#
# Configured entirely through environment variables, from .env next to this
# file (or the Environment tab when Dokploy deploys it):
#
#   CLIENT_ID, HOST_NAME, INGEST_URL, INGEST_PASSWORD     required
#   JOURNAL_DIR          where the host keeps its journal (/var/log/journal)
#   DB_<NAME>=<url>      a database to monitor; see docs/databases.md
#   AGENT_DB_NETWORK     the Docker network those databases are on, e.g.
#                        dokploy-network
#   COMPOSE_PROFILES=crowdsec, CROWDSEC_*                 optional CrowdSec;
#                        see docs/crowdsec.md
#   COMPOSE_PROFILES=backup, RESTIC_*, BACKUP_*           optional backups
#                        with restic; see docs/backups.md
#                        (both: COMPOSE_PROFILES=crowdsec,backup)
#
# The agent generates its database and CrowdSec config from these at every
# start, so changing a variable and redeploying is all a change takes.
# install.sh is an optional helper that writes this .env for you, detects
# the journal and database networks, and checks the result.
#
# The agent opens no inbound ports and only ever connects outbound to the
# ingest URL. CrowdSec's local API listens on the host's loopback only.
# ─────────────────────────────────────────────────────────────────────────────

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  alloy:
    build: .
    image: grafana-prometheus-loki/agent
    container_name: grafana-prometheus-loki-agent
    restart: unless-stopped

    # Needed to read the host's cgroups, processes and block devices.
    # This is the same access cAdvisor and node_exporter normally require.
    privileged: true
    pid: host

    command:
      - run
      # Bound to loopback: the agent's own UI is for local debugging only.
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      # Otherwise Alloy reports which components it runs to Grafana Labs.
      - --disable-reporting
      # A directory: Alloy loads every .alloy file in it as one config.
      - /etc/alloy

    # DB_* variables have names Compose cannot know in advance, so the whole
    # .env is passed through. Optional, for when Dokploy supplies the
    # variables some other way.
    env_file:
      - path: .env
        required: false
    environment:
      CLIENT_ID: ${CLIENT_ID:?CLIENT_ID is required}
      HOST_NAME: ${HOST_NAME:?HOST_NAME is required}
      INGEST_URL: ${INGEST_URL:?INGEST_URL is required}
      INGEST_PASSWORD: ${INGEST_PASSWORD:?INGEST_PASSWORD is required}
      # Tells the start-up script whether to collect CrowdSec's metrics.
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}

    # Databases that listen on the host's own loopback are reached through
    # the Docker gateway. Databases in other containers are reached by
    # joining their network: AGENT_DB_NETWORK (see `networks:` at the bottom),
    # or several, which install.sh adds in docker-compose.override.yml.
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [default, agent-db, databases]

    volumes:
      # Write-ahead log. Metrics survive a central outage and replay on
      # reconnect, so a maintenance window leaves no gap in the graphs.
      - alloy-data:/var/lib/alloy/data
      # Host filesystem, read-only — node metrics.
      - /:/rootfs:ro,rslave
      - /sys:/sys:ro
      # Container metrics and logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      # System logs, wherever this host keeps its journal: /var/log/journal
      # when stored on disk, /run/log/journal when only in memory.
      - ${JOURNAL_DIR:-/var/log/journal}:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      # Results of the backup service's runs, read by the host collector's
      # textfile reader. Writable only so start-up can clear them when
      # backups are off.
      - backup-metrics:/var/lib/node-textfile

    logging: *default-logging

  # ── CrowdSec (optional, `crowdsec` profile) ────────────────────────────────
  # Exists only when COMPOSE_PROFILES=crowdsec. See docs/crowdsec.md.
  #
  # The detection engine. Reads the host's journal (sshd) and container logs
  # (Traefik, nginx), and decides whom to ban. crowdsec/engine-start.sh
  # applies the CROWDSEC_* settings at every start.
  crowdsec:
    build:
      context: ./crowdsec
      dockerfile: engine.Dockerfile
    image: grafana-prometheus-loki/crowdsec
    container_name: grafana-prometheus-loki-crowdsec
    profiles: [crowdsec]
    restart: unless-stopped
    environment:
      COLLECTIONS: >-
        crowdsecurity/linux crowdsecurity/sshd crowdsecurity/traefik
        crowdsecurity/nginx crowdsecurity/whitelist-good-actors
      # The image registers a bouncer for every BOUNCER_KEY_<name> variable,
      # so this is the bouncer "firewall" below. (Any variable containing
      # BOUNCER_KEY counts, hence not CROWDSEC_BOUNCER_KEY here.) Required
      # with CrowdSec, but checked by engine-start.sh rather than with :?:
      # Compose checks :? even when the profile is off.
      BOUNCER_KEY_firewall: ${CROWDSEC_BOUNCER_KEY:-}
      CROWDSEC_WHITELIST: ${CROWDSEC_WHITELIST:-}
      CROWDSEC_ENROLL_KEY: ${CROWDSEC_ENROLL_KEY:-}
      HOST_NAME: ${HOST_NAME:-}
      CLIENT_ID: ${CLIENT_ID:-}
    volumes:
      # Its database of decisions, and the hub items and credentials it
      # downloads on first start.
      - crowdsec-data:/var/lib/crowdsec/data
      - crowdsec-config:/etc/crowdsec
      - ${JOURNAL_DIR:-/var/log/journal}:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Dokploy's Traefik writes its access log to a file, not stdout. Set
      # CROWDSEC_TRAEFIK_DIR=/etc/dokploy/traefik/dynamic on a Dokploy host.
      - ${CROWDSEC_TRAEFIK_DIR:-./crowdsec/no-traefik}:/var/log/traefik:ro
    ports:
      # The local API, for the bouncer, which runs in the host's network.
      # Loopback only.
      - "127.0.0.1:${CROWDSEC_LAPI_PORT:-8089}:8080"
    healthcheck:
      # Healthy once the local API answers and the start-up step has
      # registered the bouncer and applied the whitelist.
      test: ["CMD-SHELL", "cscli lapi status >/dev/null 2>&1 && test -f /tmp/grafana-prometheus-loki-setup-done"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    logging: *default-logging

  # The part that blocks. Pulls decisions from the engine every 10 seconds
  # and drops banned addresses in nftables, for the host and for Docker's
  # published ports alike. Needs the host's network and NET_ADMIN for that,
  # and nothing else. Built from CrowdSec's package: crowdsec/bouncer.Dockerfile.
  crowdsec-firewall-bouncer:
    build:
      context: ./crowdsec
      dockerfile: bouncer.Dockerfile
    image: grafana-prometheus-loki/crowdsec-firewall-bouncer
    container_name: grafana-prometheus-loki-crowdsec-bouncer
    profiles: [crowdsec]
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    # Its metrics listen on this address; see crowdsec/firewall-bouncer.yaml.
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      CROWDSEC_BOUNCER_KEY: ${CROWDSEC_BOUNCER_KEY:-}
      CROWDSEC_LAPI_PORT: ${CROWDSEC_LAPI_PORT:-8089}
    depends_on:
      crowdsec:
        condition: service_healthy
    logging: *default-logging

  # ── Backups (optional, `backup` profile) ───────────────────────────────────
  # Exists only when COMPOSE_PROFILES contains backup. See docs/backups.md.
  #
  # restic on BACKUP_SCHEDULE: host paths, Docker volumes, and a streamed
  # dump of every database. Each run's result goes to backup-metrics, which
  # the agent reports; alerts fire when a backup fails or gets too old.
  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    image: grafana-prometheus-loki/backup
    container_name: grafana-prometheus-loki-backup
    profiles: [backup]
    restart: unless-stopped
    # A fixed hostname, so restic recognises a lock left by a run that a
    # redeploy interrupted as stale and clears it. With Docker's random one it
    # would block retention and checks for 30 minutes.
    hostname: grafana-prometheus-loki-backup
    # RESTIC_* and the storage backend's own variables (AWS_*, B2_*, ...),
    # BACKUP_* and DB_* / BACKUP_DB_*: too many to list, so all of .env.
    env_file:
      - path: .env
        required: false
    environment:
      HOST_NAME: ${HOST_NAME:-}
    volumes:
      # The host, read-only: what gets backed up. Snapshot paths start with
      # /rootfs, so /rootfs/etc is the host's /etc.
      - /:/rootfs:ro
      - backup-metrics:/metrics
      # restic's local cache of the repository's index; makes runs faster.
      - backup-cache:/root/.cache/restic
    # Reaches the databases the same way the agent does.
    networks: [default, agent-db, databases]
    extra_hosts:
      - host.docker.internal:host-gateway
    logging: *default-logging

volumes:
  alloy-data:
  crowdsec-data:
  crowdsec-config:
  backup-metrics:
  backup-cache:

networks:
  # AGENT_DB_NETWORK, joined as an existing network. Compose cannot make
  # `external` depend on whether a variable is set, and the built-in bridge
  # network cannot be joined this way, so when it is unset this points at
  # agent-db: a small network of the agent's own that Compose creates first.
  # Set on the network itself rather than in an override file, because
  # Dokploy deploys with -f, which skips docker-compose.override.yml.
  agent-db:
    name: grafana-prometheus-loki-agent-db
  databases:
    name: ${AGENT_DB_NETWORK:-grafana-prometheus-loki-agent-db}
    external: true
