worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log which client pushed what — the first thing you want when an
    # agent goes quiet or starts erroring.
    log_format ingest '$remote_addr client=$remote_user "$request" '
                      '$status ${body_bytes_sent}b ${request_time}s';
    access_log /dev/stdout ingest;

    sendfile      on;
    tcp_nodelay   on;
    server_tokens off;

    # Remote-write batches are compressed protobuf; they are not large,
    # but a backlogged agent flushing after an outage can be.
    client_max_body_size 64m;
    client_body_buffer_size 1m;

    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Docker's embedded DNS. Combined with the variables below this makes
    # nginx re-resolve upstreams, so a Prometheus or Loki restart (new
    # container IP) does not leave the gateway pointing at a dead address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;

        set $prometheus_upstream http://prometheus:9090;
        set $loki_upstream       http://loki:3100;

        # Unauthenticated — used by the container healthcheck only.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ── Metrics: Prometheus remote_write ───────────────────────────────
        location = /api/v1/write {
            auth_basic           "grafana-prometheus-loki ingest";
            auth_basic_user_file /etc/nginx/ingest.htpasswd;

            proxy_pass $prometheus_upstream/api/v1/write;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Do not forward the agent's credentials to Prometheus.
            proxy_set_header Authorization "";
        }

        # ── Logs: Loki push ────────────────────────────────────────────────
        # X-Scope-OrgID is set from the AUTHENTICATED username, never from
        # anything the agent sent. This is what makes log tenancy real: a
        # client holding acme's password can only ever write to acme.
        location = /loki/api/v1/push {
            auth_basic           "grafana-prometheus-loki ingest";
            auth_basic_user_file /etc/nginx/ingest.htpasswd;

            proxy_pass $loki_upstream/loki/api/v1/push;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scope-OrgID $remote_user;
            proxy_set_header Authorization "";
        }

        # Nothing else is reachable from the internet.
        location / {
            return 404 "not an ingest endpoint\n";
        }
    }
}
