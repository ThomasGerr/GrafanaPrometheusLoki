groups:
  # Monitoring the monitoring. If these fire, trust nothing else until fixed.
  - name: meta
    rules:
      - alert: PrometheusRuleEvaluationFailing
        expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
        for: 5m
        labels:
          severity: critical
          client: self
        annotations:
          summary: "Prometheus is failing to evaluate alert rules"
          description: "Some alerts are silently not being checked. Fix immediately."
          runbook: "docs/alert-runbook.md#prometheusruleevaluationfailing"

      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: critical
          client: self
        annotations:
          summary: "Prometheus config reload failed"
          description: >-
            Prometheus is running on its last good config. Whatever you just
            deployed did not take effect.
          runbook: "docs/alert-runbook.md#prometheusconfigreloadfailed"

      - alert: AlertmanagerNotificationsFailing
        expr: increase(alertmanager_notifications_failed_total[15m]) > 0
        for: 5m
        labels:
          severity: critical
          client: self
        annotations:
          summary: "Alertmanager cannot deliver notifications ({{ $labels.integration }})"
          description: >-
            Alerts are firing but the emails are not arriving. Usually expired
            or rejected SMTP credentials.
          runbook: "docs/alert-runbook.md#alertmanagernotificationsfailing"

      - alert: AlertmanagerConfigReloadFailed
        expr: alertmanager_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: critical
          client: self
        annotations:
          summary: "Alertmanager config reload failed"
          description: "Routing changes from the last `make generate` did not apply."
          runbook: "docs/alert-runbook.md#prometheusconfigreloadfailed"

      - alert: LokiRequestErrors
        expr: |
          sum by (route) (rate(loki_request_duration_seconds_count{status_code=~"5.."}[10m]))
            /
          sum by (route) (rate(loki_request_duration_seconds_count[10m]))
          > 0.05
        for: 15m
        labels:
          severity: warning
          client: self
        annotations:
          summary: "Loki is erroring on {{ $labels.route }}"
          description: "Over 5% of requests are failing. Log ingestion or querying is degraded."
          runbook: "docs/alert-runbook.md#lokirequesterrors"

      - alert: PrometheusTSDBCompactionFailing
        expr: increase(prometheus_tsdb_compactions_failed_total[3h]) > 0
        for: 15m
        labels:
          severity: warning
          client: self
        annotations:
          summary: "Prometheus TSDB compaction is failing"
          description: "Usually disk pressure on the monitoring host. Retention will stop working."
          runbook: "docs/alert-runbook.md#prometheustsdbcompactionfailing"

      # The self-scrape jobs in prometheus.yml. Prometheus itself is not in
      # the list: if it is down, nothing evaluates this rule.
      - alert: MonitoringServiceDown
        expr: up{job=~"alertmanager|loki|blackbox-exporter|grafana"} == 0
        for: 5m
        labels:
          severity: critical
          client: self
        annotations:
          summary: "Monitoring service {{ $labels.job }} is down"
          description: >-
            Prometheus cannot reach {{ $labels.job }} on the monitoring host.
            Depending on which one, alerts, logs, uptime checks or dashboards
            are not working.
          runbook: "docs/alert-runbook.md#monitoringservicedown"

      # Alerts that fire but never reach Alertmanager are the quietest
      # failure there is: nothing downstream knows they existed. Prometheus
      # evaluates the metric alerts, Loki's ruler the security alerts.
      - alert: AlertsNotReachingAlertmanager
        # Summed per metric: increase() drops the metric name, and errors and
        # dropped carry identical labels, so one regex selector would collide.
        expr: |
          (
            sum by (job) (increase(prometheus_notifications_errors_total[10m]))
            + sum by (job) (increase(prometheus_notifications_dropped_total[10m]))
          ) > 0
          or
          (
            sum by (job) (increase(loki_prometheus_notifications_errors_total[10m]))
            + sum by (job) (increase(loki_prometheus_notifications_dropped_total[10m]))
          ) > 0
        for: 5m
        labels:
          severity: critical
          client: self
        annotations:
          summary: "{{ $labels.job }} cannot deliver alerts to Alertmanager"
          description: >-
            Alerts evaluated by {{ $labels.job }} are being lost before they
            reach Alertmanager, so no email goes out for them.
          runbook: "docs/alert-runbook.md#alertsnotreachingalertmanager"

      # A tenant over its ingestion limits, or an agent sending lines Loki
      # refuses, loses logs without any error reaching the agent's host.
      - alert: LokiDiscardingLogs
        expr: sum by (tenant, reason) (increase(loki_discarded_samples_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
          client: self
        annotations:
          summary: "Loki is dropping logs from {{ $labels.tenant }} ({{ $labels.reason }})"
          description: >-
            {{ $value | printf "%.0f" }} log lines were rejected in 15 minutes.
            Those lines are gone; searching for them will find nothing.
          runbook: "docs/alert-runbook.md#lokidiscardinglogs"

      - alert: NoClientDataAtAll
        expr: |
          count(count by (client) (up{job="node", client!="self"})) == 0
        for: 15m
        labels:
          severity: critical
          client: self
        annotations:
          summary: "No client agents are reporting"
          description: >-
            Not a single client host is pushing metrics. The ingest gateway,
            its credentials, or DNS is broken — not every client at once.
          runbook: "docs/alert-runbook.md#noclientdataatall"
