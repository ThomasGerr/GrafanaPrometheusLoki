# ─────────────────────────────────────────────────────────────────────────────
# Client metrics are NOT scraped from here — agents push them in via the
# ingest gateway (remote_write). The scrape jobs below cover only the
# monitoring stack itself and the outward-facing blackbox probes.
# ─────────────────────────────────────────────────────────────────────────────

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    monitor: grafana-prometheus-loki

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.rules.yml

# Per-client blackbox targets, written by `make generate` from clients.yml.
scrape_config_files:
  - /etc/prometheus/scrape/*.yml

scrape_configs:
  # The monitoring stack monitors itself. It carries client="self" so
  # your own infrastructure behaves like just another tenant in the
  # admin dashboards, while never leaking into a client's Org.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: { client: self, instance: monitor-host }

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels: { client: self, instance: monitor-host }

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels: { client: self, instance: monitor-host }

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]
        labels: { client: self, instance: monitor-host }

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels: { client: self, instance: monitor-host }
