apiVersion: 1

providers:
  # Admin Org only. Client Orgs receive the same dashboards through
  # `make bootstrap`, which pushes them over the API.
  - name: grafana-prometheus-loki
    orgId: 1
    folder: Monitoring
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
