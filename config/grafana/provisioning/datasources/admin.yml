# GENERATED by scripts/generate.py from clients.yml — do not edit by hand.
apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1
  - name: Backups
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s
      httpMethod: POST

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    orgId: 1
    url: http://loki:3100
    editable: false
    jsonData:
      timeout: 60
      maxLines: 5000
      # Every tenant at once — admin view.
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: "self"

  # The backup control API. It listens on the internal network only, so the
  # Backups dashboard reaches it through here — Grafana's own backend — and
  # the admin token never leaves the server.
  - name: Backups
    uid: backups
    type: yesoreyeram-infinity-datasource
    orgId: 1
    editable: false
    jsonData:
      global_queries: []
      allowedHosts:
        - http://backup-api:3000
      httpHeaderName1: X-API-Key
    secureJsonData:
      httpHeaderValue1: $BACKUP_API_TOKEN
