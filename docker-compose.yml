# ─────────────────────────────────────────────────────────────────────────────
# grafana-prometheus-loki — central observability stack (Dokploy / production)
#
# Deploy on Dokploy as a "Docker Compose" service pointed at this repo.
#
# NOTHING here publishes a port. Every service talks to its neighbours over
# the private `em-monitor` bridge using container names, and the only way in
# from outside is Traefik. Add exactly two entries in the Dokploy Domains tab:
#
#     grafana  → port 3000   e.g. monitor.example.com
#     ingest   → port 8080   e.g. ingest.example.com
#
# Routing, certificates and networking for those two are configured in the
# Dokploy interface — nothing is hand-wired here.
#
# Prometheus, Alertmanager, Loki and blackbox are reachable only from inside
# the network. See `make tunnel` for temporary local access to them.
#
# For local development use docker-compose.dev.yml (`make up`), which is the
# same stack with 127.0.0.1 ports published.
# ─────────────────────────────────────────────────────────────────────────────

include:
  # Generated by `make generate` from clients.yml — one prom-label-proxy per client.
  - docker-compose.clients.yml

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── Metrics storage ────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: em-prometheus
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=20GB
      # Required: agents push to us instead of us scraping them.
      - --web.enable-remote-write-receiver
      # Allows `make reload` to apply config without a restart.
      - --web.enable-lifecycle
      - --web.external-url=/
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks: [monitor]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Alert routing ──────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.34.0
    container_name: em-alertmanager
    restart: unless-stopped
    user: "65534:65534"
    # Alertmanager cannot expand env vars, so a start-up script renders the
    # committed template before exec'ing the real binary.
    entrypoint: ["/bin/sh", "/etc/alertmanager/render-and-run.sh"]
    command:
      - --storage.path=/alertmanager
      - --web.external-url=${GRAFANA_ROOT_URL:-http://localhost:3000}/alertmanager
      # external-url would otherwise move every route behind /alertmanager,
      # including the health endpoint. Links in emails keep the external URL;
      # the HTTP routes stay at the root.
      - --web.route-prefix=/
    environment:
      SMTP_SMARTHOST: ${SMTP_SMARTHOST}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      OPS_EMAIL: ${OPS_EMAIL}
    volumes:
      - ./config/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    networks: [monitor]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Log storage (multi-tenant) ─────────────────────────────────────────────
  loki:
    image: grafana/loki:3.7.6
    container_name: em-loki
    restart: unless-stopped
    user: "10001:10001"
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./config/loki/loki.yml:/etc/loki/loki.yml:ro
      - ./config/loki/rules:/etc/loki/rules:ro
      - loki-data:/loki
    networks: [monitor]
    logging: *default-logging
    # No healthcheck: the Loki image is distroless — it contains the binary and
    # nothing else, so there is no shell or wget to probe with. Dependents use
    # `service_started` instead, and the ingest gateway re-resolves and retries
    # per request, so a slow Loki start costs at most a few dropped pushes.

  # ── External uptime / TLS probing ──────────────────────────────────────────
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: em-blackbox
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./config/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [monitor]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9115/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ── Public ingest gateway (agents push here) ───────────────────────────────
  # Authenticates each client agent and stamps the Loki tenant from the
  # authenticated username, so a client cannot write into another's logs.
  ingest:
    build:
      context: ./config/ingest
    image: grafana-prometheus-loki/ingest:1
    container_name: em-ingest
    restart: unless-stopped
    environment:
      INGEST_USERS: ${INGEST_USERS}
    networks: [monitor]
    logging: *default-logging
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      # 127.0.0.1, not localhost: inside this image localhost resolves to ::1
      # first and nginx listens on IPv4 only, so the probe would be refused.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ── Dashboards (one Org per client) ────────────────────────────────────────
  grafana:
    image: grafana/grafana:13.1.4
    container_name: em-grafana
    restart: unless-stopped
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: light
      # Clients are Viewers; stop them from wandering out of their dashboards.
      GF_EXPLORE_ENABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_SMARTHOST}
      GF_SMTP_USER: ${SMTP_USER}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM}
      GF_SMTP_FROM_NAME: "Monitoring"
      # Image rendering. The renderer is not part of the stack: `make render`
      # starts it on this network for one run and removes it again, so between
      # runs these point at nothing and on-demand renders simply fail.
      GF_RENDERING_SERVER_URL: http://em-renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      # Shared with the renderer. Grafana refuses to start with the default.
      GF_RENDERING_RENDERER_TOKEN: ${RENDERER_TOKEN:?RENDERER_TOKEN is required}
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [monitor]
    logging: *default-logging
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  grafana-data:

networks:
  # The stack's own private bridge. Nothing is published to the host; services
  # reach each other by container name on this network alone.
  #
  # Deliberately NOT `internal: true` — blackbox-exporter has to reach client
  # websites, and Alertmanager and Grafana have to reach the SMTP host.
  # `internal: true` would cut all outbound traffic and silently break both
  # uptime probing and alert delivery.
  monitor:
    name: em-monitor

  # Routing in from outside is configured in the Dokploy Domains tab.
  # If Traefik does not reach grafana/ingest, it is the known Dokploy compose
  # networking gotcha: uncomment the block below, add `dokploy-network` to
  # those two services, and label them `traefik.docker.network=dokploy-network`.
  #
  # dokploy-network:
  #   external: true
